<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{{PUBLICATION}} — {{ISSUE_DATE}}</title>
    <style>
        /*
         * PRODUCTION PRINT SETTINGS
         * Trim 10in square, with bleed and crop marks for the press.
         * Two-tone: process black plus one red.
         */
        @page {
            size: {{PAGE_SIZE}};
            margin: {{PAGE_MARGIN}};
            prince-bleed: {{PAGE_BLEED}};
            prince-trim: {{PAGE_TRIM}};
            marks: crop;
            prince-print-color-adjust: exact;
        }

        /* --- injected stylesheets, in cascade order --- */

        {{COLORS_CSS}}

        {{TYPOGRAPHY_CSS}}

        {{LAYOUT_CSS}}
    </style>
</head>

<body>
    {{PAGES_HTML}}
</body>

</html>
